<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  {% include "common.html" %}
  <style>
    .player-container {
      position: relative;
      max-width: 960px;
      margin: 0 auto;
      background: #000;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* Кнопка Назад */
    .back-button {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 9999;
      display: inline-block;
      padding: 8px 14px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 14px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
    }
    .slide-img.active {
      display: block;
    }

    /* Большая центральная кнопка Play */
    .big-play-btn {
      position: absolute;
      width: 80px;
      height: 80px;
      background: rgba(0, 0, 0, 0.7);
      border: 3px solid #fff;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.3s;
      z-index: 10;
    }
    .big-play-btn:hover {
      transform: scale(1.1);
      background: rgba(255, 0, 0, 0.8);
    }
    .big-play-btn::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 15px 0 15px 26px;
      border-color: transparent transparent transparent #fff;
      margin-left: 5px;
    }
    .player-container.playing .big-play-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* Нижняя панель управления */
    .controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* Управление видимостью органов управления через класс user-active */
    .player-container.user-active .controls-bar,
    .player-container.user-active .back-button {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .timeline-slider {
      width: 100%;
      cursor: pointer;
      accent-color: #ff0000;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .btn:hover { color: #ff0000; }
  </style>
</head>
<body>

<div class="player-container user-active" id="player">
  <!-- Кнопка Назад перемещена внутрь контейнера плеера -->
  <a href="./" class="back-button">← Назад</a>

  <!-- Слайды -->
  {% for slide in slides %}
    <img src="{{ slide.src }}" class="slide-img {% if forloop.first %}active{% endif %}" data-index="{{ slide.id }}">
  {% endfor %}

  <!-- Кнопка Play по центру -->
  <div class="big-play-btn" id="bigPlayBtn"></div>

  <!-- Контролы -->
  <div class="controls-bar" id="controlsBar">
    <input type="range" class="timeline-slider" id="timeline" min="0" max="{{ whole_duration_sec }}" value="0" step="0.1">

    <div class="controls-row">
      <div class="controls-left">
        <button class="btn" id="playPauseBtn">▶</button>
        <span id="timeDisplay">0:00 / 0:00</span>
      </div>
      <div class="controls-right">
        <button class="btn" id="fullscreenBtn">⛶</button>
      </div>
    </div>
  </div>

  <audio id="audio" src="{{ audio_mp3 }}" preload="metadata"></audio>
</div>

<script>
  const slidesData = {{ slides_json|safe }};
  const player = document.getElementById('player');
  const audio = document.getElementById('audio');
  const bigPlayBtn = document.getElementById('bigPlayBtn');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const timeline = document.getElementById('timeline');
  const timeDisplay = document.getElementById('timeDisplay');
  const slideImages = document.querySelectorAll('.slide-img');

  let currentSlideIndex = -1;
  let isScrubbing = false;
  let controlsTimeout;

  // Функция показа элементов управления и автоскрытия
  function showControls() {
    player.classList.add('user-active');
    clearTimeout(controlsTimeout);

    if (!audio.paused) {
      controlsTimeout = setTimeout(() => {
        player.classList.remove('user-active');
      }, 3000);
    }
  }

  // События активности
  player.addEventListener('mousemove', showControls);
  player.addEventListener('touchstart', showControls, { passive: true });

  audio.addEventListener('pause', () => {
    player.classList.add('user-active');
    clearTimeout(controlsTimeout);
  });

  audio.addEventListener('play', showControls);

  function formatTime(seconds) {
    if (isNaN(seconds) || seconds < 0) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  // Навигация по слайдам
  function navigateSlide(direction) {
    const currentTime = audio.currentTime;

    if (direction === 'next') {
      const nextSlide = slidesData.find(s => s.start > currentTime + 0.1);
      if (nextSlide) audio.currentTime = nextSlide.start;
    } else if (direction === 'prev') {
      const currentSlide = slidesData.find(s => currentTime >= s.start && currentTime < s.end);

      if (currentSlide && (currentTime - currentSlide.start > 1.5)) {
        audio.currentTime = currentSlide.start;
      } else {
        const prevSlides = slidesData.filter(s => s.start < currentTime - 0.1);
        if (prevSlides.length > 0) {
          audio.currentTime = prevSlides[prevSlides.length - 1].start;
        } else {
          audio.currentTime = 0;
        }
      }
    }
  }

  // Нажатия клавиш
  window.addEventListener('keydown', (event) => {
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

    if (event.key === 'ArrowRight') {
      event.preventDefault();
      navigateSlide('next');
    } else if (event.key === 'ArrowLeft') {
      event.preventDefault();
      navigateSlide('prev');
    } else if (event.key === ' ') {
      event.preventDefault();
      togglePlay();
    }
  });

  function updateSlide(currentTime) {
    const slide = slidesData.find(s => currentTime >= s.start && currentTime < s.end)
                  || slidesData[slidesData.length - 1];
    if (slide && slide.id !== currentSlideIndex) {
      currentSlideIndex = slide.id;
      slideImages.forEach(img => img.classList.remove('active'));
      const activeImg = document.querySelector(`.slide-img[data-index="${slide.id}"]`);
      if (activeImg) activeImg.classList.add('active');
    }
  }

  function togglePlay() {
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  }

  bigPlayBtn.addEventListener('click', togglePlay);
  playPauseBtn.addEventListener('click', togglePlay);

  audio.addEventListener('play', () => {
    player.classList.add('playing');
    playPauseBtn.textContent = '❚❚';
  });

  audio.addEventListener('pause', () => {
    player.classList.remove('playing');
    playPauseBtn.textContent = '▶';
  });

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      player.requestFullscreen().catch(err => console.error(err));
    } else {
      document.exitFullscreen();
    }
  });

  function initDuration() {
    if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
      timeline.max = audio.duration;
    }
  }

  audio.addEventListener('loadedmetadata', initDuration);
  audio.addEventListener('durationchange', initDuration);

  audio.addEventListener('timeupdate', () => {
    if (!isScrubbing) {
      timeline.value = audio.currentTime;
      updateSlide(audio.currentTime);
      const maxDur = audio.duration || parseFloat(timeline.max) || 0;
      timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(maxDur)}`;
    }
  });

  function performSeek(targetTime) {
    if (isNaN(targetTime)) return;
    updateSlide(targetTime);
    try {
      audio.currentTime = targetTime;
    } catch (e) {
      console.warn("Ошибка при смене времени:", e);
    }
    const maxDur = audio.duration || parseFloat(timeline.max) || 0;
    timeDisplay.textContent = `${formatTime(targetTime)} / ${formatTime(maxDur)}`;
  }

  timeline.addEventListener('mousedown', () => { isScrubbing = true; });
  timeline.addEventListener('touchstart', () => { isScrubbing = true; });

  timeline.addEventListener('input', (e) => {
    performSeek(parseFloat(e.target.value));
  });

  function onScrubEnd() {
    if (isScrubbing) {
      isScrubbing = false;
      performSeek(parseFloat(timeline.value));
    }
  }

  timeline.addEventListener('mouseup', onScrubEnd);
  timeline.addEventListener('touchend', onScrubEnd);
  timeline.addEventListener('change', (e) => {
    isScrubbing = false;
    performSeek(parseFloat(e.target.value));
  });
</script>

</body>
</html>
